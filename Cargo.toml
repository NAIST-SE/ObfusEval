[package]
name = "obfus-eval"
version = "1.0.0-alpha"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.65"
clap = { version = "4.5.29", features = ["derive"] }
console = "0.15.2"
duct = "0.13.5"
glob = "0.3.2"
indicatif = { version = "0.17.1", features = ["rayon"] }
nom = "8.0.0"
quanta = "0.12.5"
rayon = "1.5.3"
rs_algo = "0.2.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.11"
